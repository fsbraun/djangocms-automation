name: Publish to PyPI

on:
  release:
    types: [ published ]

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.13"

    - name: Check the release tag matches the package version
      run: |
        version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' djangocms_automation/__init__.py)
        tag="${GITHUB_REF_NAME#v}"
        if [ "$version" != "$tag" ]; then
          echo "::error::Release tag $GITHUB_REF_NAME does not match __version__ $version"
          exit 1
        fi

    - name: Build sdist and wheel
      run: |
        python -m pip install --upgrade build twine
        python -m build
        twine check --strict dist/*

    - uses: actions/upload-artifact@v7
      with:
        name: dist
        path: dist/

  publish:
    name: Upload to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/djangocms-automation
    permissions:
      id-token: write  # trusted publishing
    steps:
    - uses: actions/download-artifact@v8
      with:
        name: dist
        path: dist/

    - uses: pypa/gh-action-pypi-publish@release/v1
