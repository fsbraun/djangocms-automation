name: Tests
permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
        django-version: ["6.0", "6.1"]
        cms-version: ["5.0", "5.1"]

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install -r tests/requirements/base.txt
        # Pin last so the matrix wins: installing the package or the test
        # requirements afterwards can quietly resolve a different version, and
        # the "~=X.Y.0" form keeps a row on its own minor — plain "~=6.0" means
        # ">=6.0,<7.0", which would let the 6.0 row install 6.1.
        pip install "Django~=${{ matrix.django-version }}.0" "django-cms~=${{ matrix.cms-version }}.0"

    - name: Report the resolved versions
      run: |
        python -c "import sys, django, cms; print(f'python {sys.version.split()[0]} | django {django.get_version()} | cms {cms.__version__}')"

    - name: Run tests with coverage
      run: |
        pytest --cov=djangocms_automation --cov-report=xml --cov-report=term-missing

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      with:
        file: ./coverage.xml
        flags: unittests
        name: py${{ matrix.python-version }}-django${{ matrix.django-version }}-cms${{ matrix.cms-version }}
        fail_ci_if_error: false
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
