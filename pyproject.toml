[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools", "setuptools-scm" ]

[project]
name = "djangocms-automation"
description = "Automation tools for django CMS projects"
readme = "README.md"
license = "BSD-3-Clause"
authors = [
  { name = "Fabian Braun", email = "fsbraun@gmx.de" },
]
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Framework :: Django",
  "Framework :: Django :: 6.0",
  "Framework :: Django :: 6.1",
  "Framework :: Django CMS :: 5.0",
  "Framework :: Django CMS :: 5.1",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dynamic = [ "version" ]
dependencies = [
  "django>=6",
  "django-cms>=5",
  "jsonschema>=4.22",
]
optional-dependencies.llm = [
  # Capped deliberately: litellm ships around 35 releases a month and has made
  # breaking changes inside 1.x. The upper bound is a decision to review the
  # wrapper's contract test before moving, not a claim that 1.110 breaks.
  "litellm>=1.98,<1.110",
]
# Rendering a model's Markdown in the admin. Both halves are required: the
# renderer turns the text into HTML, and the sanitiser is what makes showing it
# safe. A model's answer can be steered by whatever arrived in the trigger, so
# it is never marked safe unrendered and never rendered unsanitised.
optional-dependencies.markdown = [
  "markdown>=3.6",
  "nh3>=0.2",
]
optional-dependencies.test = [
  "coverage",
  "pytest",
  "pytest-django",
]
urls.Homepage = "https://github.com/fsbraun/djangocms-automation"
urls.Issues = "https://github.com/fsbraun/djangocms-automation/issues"

[tool.setuptools]
packages.find.where = [ "." ]
packages.find.include = [ "djangocms_automation*" ]
package-data."*" = [
  "*.mo",
  "*.po",
  "locale/**/*",
  "static/**/*",
  "templates/**/*.html",
]
dynamic.version = { attr = "djangocms_automation.__version__" }

[tool.ruff]
target-version = "py312"
line-length = 119
exclude = [ "**/migrations" ]
lint.ignore = [
  # Django, django CMS and DRF all declare configuration as plain mutable class
  # attributes (`list_display`, `child_classes`, `fieldsets`, ...). Annotating
  # them `ClassVar` is not how those frameworks are written and would make the
  # code harder to compare with their documentation.
  "RUF012",
]
lint.mccabe.max-complexity = 5

[tool.pytest]
ini_options.testpaths = [ "tests" ]
ini_options.pythonpath = [ "." ]
ini_options.python_files = [ "*_tests.py", "test_*.py", "tests.py" ]
ini_options.addopts = [ "--tb=short", "--strict-markers", "--nomigrations" ]
ini_options.markers = [
  "django_db: mark test as requiring database access",
]
ini_options.DJANGO_SETTINGS_MODULE = "tests.settings"

[tool.coverage]
run.omit = [
  "djangocms_automation/migrations/*",
]
run.source = [
  "djangocms_automation",
]
