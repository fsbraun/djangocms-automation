version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  jobs:
    # docs/requirements.txt contains ``-e ..`` and is therefore installed
    # from the docs directory, matching the local ``make install`` workflow.
    post_install:
      - cd docs && python -m pip install -r requirements.txt

sphinx:
  configuration: docs/source/conf.py

python:
  install:
    - method: pip
      path: .
